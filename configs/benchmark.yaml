# Scientific benchmark settings; range-relative error targets are fractions of field range.
schema_version: 1
compressors:
- ebcc
- sz
- sz3
- hpez
- sperr
- mgard
range_relative_error_targets:
- 0.0001
- 0.0005
- 0.001
- 0.005
- 0.01
- 0.05
- 0.1
random_seed: 0  # Reset EBCC random sampling before each encode for reproducibility.
